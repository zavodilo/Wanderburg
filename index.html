<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Wanderburg — минималистичный средневековый рогалик: замок на колёсах катается по долине, пожирает деревни и охотится на другие крепости.">
    <meta name="theme-color" content="#171310">
    <title>Wanderburg — замок на колёсах</title>
    <script src="libs/simplex-noise.js"></script>
    <script src="libs/playcanvas.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* The touch stick lives in its own layer: UI.root is pointer-events:none by design,
           and js/Game.js binds the pointer handlers to #touch-layer when IS_MOBILE. */
        #touch-layer {
            position: fixed;
            inset: 0;
            z-index: 900;
            pointer-events: none;
            display: none;
        }
        #touch-layer .stick-zone {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 46vw;
            height: 46vh;
            max-width: 340px;
            max-height: 340px;
            pointer-events: auto;
            touch-action: none;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background: #222;
            z-index: 1000;
        }
        .loading-text {
            font: 14px system-ui, sans-serif;
            color: #c8d0d8;
            text-align: center;
            min-height: 1em;
        }
        .loading-bar {
            width: min(220px, 70vw);
            height: 10px;
            background: #444;
            border-radius: 5px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: #7cc0c7;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="touch-layer"><div class="stick-zone"></div></div>
    <div id="loading-screen">
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <div class="loading-text"></div>
    </div>

    <!-- Order matters: Constants.js first (the others read its globals), main.js last.
         Layers, physically separated:
           js/engine/        the only place that knows pc.* (PlayCanvas adapters)
           js/core/          the renderer-independent game model (GameModel, World, Entity…)
           js/presentation/  RenderProfile, Variant, Camera, Lighting, Animation, Migration
           js/profiles/      one behaviour adapter per render profile
         Gameplay (js/Game.js) may only use the semantic layer: GameModel, Entity, World,
         Input, GameAudio, Save, Scene, Edit, Kit, UI, Asset, RenderProfile, Variant,
         Camera, Lighting, Animation — never pc.*, never a profile branch. -->
    <script src="js/Constants.js"></script>
    <script src="js/GameSpec.js"></script>
    <script src="js/Objects.js"></script>
    <script src="js/UILayout.js"></script>

    <!-- engine -->
    <script src="js/engine/Sound3D.js"></script>
    <script src="js/engine/World3D.js"></script>
    <script src="js/engine/Terrain3D.js"></script>
    <script src="js/engine/CameraControl.js"></script>
    <script src="js/engine/Model3D.js"></script>
    <script src="js/engine/Gltf3D.js"></script>
    <script src="js/engine/Location3D.js"></script>
    <script src="js/engine/Procedural3D.js"></script>
    <script src="js/engine/Debug3D.js"></script>
    <script src="js/engine/Sprite2D.js"></script>
    <script src="js/engine/Camera3D.js"></script>
    <script src="js/engine/Lighting3D.js"></script>
    <script src="js/engine/Visual3D.js"></script>

    <!-- generated data: the scene contract, the profile canon, the project variants -->
    <script src="js/core/SceneSchema.js"></script>
    <script src="js/presentation/RenderProfiles.js"></script>
    <script src="js/presentation/Variants.js"></script>

    <!-- core: the semantic game model -->
    <script src="js/core/Coords.js"></script>
    <script src="js/core/Entity.js"></script>
    <script src="js/core/World.js"></script>
    <script src="js/core/GameModel.js"></script>
    <script src="js/core/Input.js"></script>
    <script src="js/core/GameAudio.js"></script>
    <script src="js/core/Save.js"></script>

    <!-- presentation: profiles and variants -->
    <script src="js/presentation/AssetRegistry.js"></script>
    <script src="js/presentation/Variant.js"></script>
    <script src="js/presentation/RenderProfile.js"></script>
    <script src="js/presentation/Camera.js"></script>
    <script src="js/presentation/Lighting.js"></script>
    <script src="js/presentation/Animation.js"></script>
    <script src="js/presentation/VisualEntity.js"></script>
    <script src="js/presentation/Migration.js"></script>
    <script src="js/presentation/Runtime.js"></script>

    <!-- profile adapters (canon: manifest/render-profiles.json) -->
    <script src="js/profiles/2d/profile.js"></script>
    <script src="js/profiles/2.5d/profile.js"></script>
    <script src="js/profiles/isometric3d/profile.js"></script>
    <script src="js/profiles/lowpoly3d/profile.js"></script>
    <script src="js/profiles/full3d/profile.js"></script>

    <script src="js/UI.js"></script>
    <script src="js/core/SceneAPI.js"></script>
    <!-- Wanderburg: data -> simulation -> view -> sound -> HUD -> the orchestrator (Game.js) -->
    <script src="js/Content.js"></script>
    <script src="js/Logic.js"></script>
    <script src="js/WanderMesh.js"></script>
    <script src="js/WanderView.js"></script>
    <script src="js/WanderAudio.js"></script>
    <script src="js/Hud.js"></script>
    <script src="js/Game.js"></script>
    <script src="js/main.js"></script>
    <script>
        // A long tap and RMB must not open the browser menu.
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
